name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Tests cover parsing and analysis logic only: no network, no Spark, no Docker needed.
      - name: Install dependencies
        run: pip install pytest curl_cffi pandas numpy scipy matplotlib
      - name: Run tests
        run: pytest -q
